<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Origin Genviz Viewer</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--background, #f8f4ee);
        color: var(--foreground, #33302e);
        font-family:
          var(--font-sans, "Inter"),
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 13px;
        line-height: 1.4;
        min-height: 100%;
      }
      #root {
        min-height: 100vh;
      }
      .empty {
        padding: 24px;
        color: #66605c;
        font-family: "Fira Code", ui-monospace, monospace;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .error {
        padding: 16px 24px;
        font-family: "Fira Code", ui-monospace, monospace;
        font-size: 12px;
        color: #c84b2c;
        white-space: pre-wrap;
      }
      iframe.widget {
        display: block;
        width: 100%;
        max-width: 720px;
        margin: 0;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="empty">Origin · awaiting tool result</div>
    </div>
    <script type="module">
      // Load the MCP Apps SDK from esm.sh. esm.sh is declared in the
      // viewer resource's CSP `resourceDomains`, so this script-load is
      // allowed under the host-enforced CSP.
      import { App } from "https://esm.sh/@modelcontextprotocol/ext-apps@1.7.1";

      const VIZ_META_KEY = "io.originhq/genviz";
      const root = document.getElementById("root");

      function renderEmpty(text) {
        root.innerHTML = "";
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = text;
        root.appendChild(div);
      }

      function renderError(text) {
        root.innerHTML = "";
        const div = document.createElement("div");
        div.className = "error";
        div.textContent = text;
        root.appendChild(div);
      }

      // Resize the iframe to match its content. The widget itself sets
      // body height; we observe it and grow the parent iframe via the
      // App's size-changed notification (handled by App internals when
      // we set body height).
      function fitIframe(iframe) {
        const sync = () => {
          try {
            const doc = iframe.contentDocument;
            if (!doc) {
              console.error("[viewer] fitIframe: contentDocument is null");
              return;
            }
            const h = Math.max(
              doc.documentElement ? doc.documentElement.scrollHeight : 0,
              doc.body ? doc.body.scrollHeight : 0,
            );
            console.error("[viewer] fitIframe: measured height=" + h + "px");
            if (h && Math.abs(iframe.clientHeight - h) > 4) {
              iframe.style.height = h + "px";
              // Bubble up so the host can resize the App iframe too.
              document.body.style.minHeight = h + "px";
              console.error("[viewer] fitIframe: resized iframe to " + h + "px");
            }
          } catch (e) {
            console.error("[viewer] fitIframe: cross-origin error (should not happen with allow-same-origin):", e);
          }
        };
        iframe.addEventListener("load", () => {
          console.error("[viewer] fitIframe: iframe load event fired");
          sync();
          // Widgets with async layout (font load, Recharts measure) settle
          // a tick later — re-sync a few times to catch them.
          setTimeout(sync, 80);
          setTimeout(sync, 250);
          setTimeout(sync, 800);
          setTimeout(sync, 2000);
        });
      }

      function renderHtml(html, title) {
        root.innerHTML = "";
        const iframe = document.createElement("iframe");
        iframe.className = "widget";
        if (title) iframe.title = title;
        // allow-scripts: React/Babel inside the widget need to run.
        // allow-same-origin: REQUIRED so we can read contentDocument.scrollHeight
        // to auto-size the iframe. The widget still can't escape the iframe.
        iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
        iframe.srcdoc = html;
        // Default height so the widget is visible even if measurement fails.
        iframe.style.height = "420px";
        fitIframe(iframe);
        root.appendChild(iframe);
        console.error("[viewer] renderHtml: iframe appended, srcdoc length=" + html.length);
      }

      function pickViz(result) {
        console.error("[viewer] pickViz called with result keys:", Object.keys(result || {}));
        console.error("[viewer] pickViz result._meta:", result?._meta);
        if (!result || typeof result !== "object") {
          console.error("[viewer] pickViz: result is not an object");
          return null;
        }
        const meta = result._meta;
        console.error("[viewer] pickViz meta:", meta);
        if (!meta || typeof meta !== "object") {
          console.error("[viewer] pickViz: no meta");
          return null;
        }
        const v = meta[VIZ_META_KEY];
        console.error("[viewer] pickViz viz payload:", v ? { keys: Object.keys(v), htmlLength: v.html?.length } : null);
        if (!v || typeof v !== "object") {
          console.error("[viewer] pickViz: no viz payload under key", VIZ_META_KEY);
          return null;
        }
        if (typeof v.html !== "string" || !v.html) {
          console.error("[viewer] pickViz: html is not a string or empty");
          return null;
        }
        console.error("[viewer] pickViz: FOUND viz, html length=" + v.html.length);
        return { html: v.html, title: typeof v.title === "string" ? v.title : null };
      }

      const app = new App({ name: "origin-genviz-viewer", version: "0.2.0" });

      app.addEventListener("toolresult", (params) => {
        console.error("[viewer] ontoolresult FIRED");
        console.error("[viewer] params keys:", Object.keys(params || {}));
        console.error("[viewer] params.isError:", params?.isError);
        console.error("[viewer] params._meta:", params?._meta);
        console.error("[viewer] full params:", JSON.stringify(params, null, 2));
        try {
          if (params && params.isError) {
            // Surface upstream error text instead of an empty view.
            const text =
              (params.content || [])
                .filter((c) => c && c.type === "text" && typeof c.text === "string")
                .map((c) => c.text)
                .join("\n") || "(no error detail)";
            renderError("Tool error\n\n" + text);
            return;
          }
          const viz = pickViz(params);
          console.error("[viewer] pickViz returned:", viz ? { htmlLength: viz.html.length, title: viz.title } : null);
          if (!viz) {
            // Collapse viewer when there is no viz (text-only tool result)
            root.innerHTML = "";
            document.body.style.minHeight = "0";
            document.documentElement.style.height = "auto";
            console.error("[viewer] collapsed viewer (no viz)");
            return;
          }
          renderHtml(viz.html, viz.title);
        } catch (e) {
          console.error("[viewer] CRASH in ontoolresult:", e);
          renderError("Viewer crashed: " + (e && e.stack ? e.stack : String(e)));
        }
      });

      app.addEventListener("toolinput", (params) => {
        console.error("[viewer] ontoolinput FIRED, tool=", params?.name);
      });

      app.addEventListener("teardown", async () => {
        console.error("[viewer] teardown received");
      });

      console.error("[viewer] starting App connect...");
      try {
        await app.connect();
        console.error("[viewer] App.connect SUCCESS");
      } catch (e) {
        console.error("[viewer] App.connect FAILED:", e);
        renderError("App.connect failed: " + (e && e.message ? e.message : String(e)));
      }

      window.addEventListener("error", (e) => {
        console.error("[viewer] global error:", e.error);
      });
    </script>
  </body>
</html>
